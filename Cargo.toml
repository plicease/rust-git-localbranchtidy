[package]
name = "git-localbranchtidy"
version = "0.1.0"
edition = "2024"
description = "Delete all branches that have been merged into `main` or `master`."
repository = "https://github.com/plicease/git-localbranchtidy"
license = "MIT"

[dependencies]
anyhow = "1.0.104"


[package.metadata.deb]
maintainer = "Graham Ollis <devnull@wdlabs.com>"
copyright = "2026 Graham Ollis"
changelog = "debian/changelog"
extended-description = """\
git localbranchtidy is a git subcommand that detects the repository's main
branch (usually main or master) and deletes every local branch whose tip has
already been merged into it. The main branch and the currently checked-out
branch are always left alone, and branches are removed with "git branch -d"
so a branch that is not actually merged is never deleted.

An interactive mode asks before removing each branch, and the main branch can
be named explicitly to override the auto-detection."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/git-localbranchtidy", "usr/bin/", "755"],
    ["man/git-localbranchtidy.1", "usr/share/man/man1/git-localbranchtidy.1", "644"],
    ["README.md", "usr/share/doc/git-localbranchtidy/README.md", "644"],
    ["LICENSE", "usr/share/doc/git-localbranchtidy/LICENSE", "644"],
]

